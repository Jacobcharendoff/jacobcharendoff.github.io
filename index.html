<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jacob Charendoff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #000; --text: #f5f5f7; --dim: #86868b; --faint: #48484a;
  --font: 'Inter', -apple-system, sans-serif;
  --accent: #2997ff;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  user-select: none;
  transition: background 0.8s ease;
}

/* ══════════════════════════════════════
   STAGE
   ══════════════════════════════════════ */
.stage {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 56px 48px 20px;
  position: relative; overflow: hidden;
}
.stage::before {
  content: '';
  position: absolute;
  top: 30%; left: 50%; transform: translate(-50%, -50%);
  width: 600px; height: 400px;
  background: radial-gradient(ellipse, var(--glow, rgba(41,151,255,0.06)) 0%, transparent 70%);
  pointer-events: none;
  transition: background 0.8s ease;
  z-index: 0;
}
.stage > * { position: relative; z-index: 1; }

/* Top bar */
.top {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 16px 48px;
  display: flex; align-items: center; justify-content: space-between;
}
.top-name { font-size: 13px; font-weight: 600; color: var(--dim); }
.top-right { display: flex; align-items: center; gap: 16px; }
.top-chapter {
  font-size: 11px; color: var(--faint); font-weight: 500;
  letter-spacing: 1px; text-transform: uppercase;
}
.top-depth-indicator {
  font-size: 10px; color: var(--accent); font-weight: 600;
  letter-spacing: 0.5px;
  opacity: 0; transition: opacity 0.3s;
}
.top-depth-indicator.show { opacity: 1; }

/* ══════════════════════════════════════
   CONTENT: morphs in place
   ══════════════════════════════════════ */
.content {
  display: flex; flex-direction: column;
  align-items: center; gap: 0;
  transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  max-width: 800px; width: 100%;
}
.content.slide-out-up { opacity: 0; transform: translateY(-30px); }
.content.slide-out-down { opacity: 0; transform: translateY(30px); }

/* Eyebrow */
.eyebrow {
  font-size: 12px; font-weight: 600;
  letter-spacing: 2px; text-transform: uppercase;
  margin-bottom: 16px;
}

/* Headline */
.headline {
  font-size: clamp(40px, 7vw, 88px);
  font-weight: 900; letter-spacing: -3px; line-height: 1.0;
  margin-bottom: 12px;
}

/* Role */
.role {
  font-size: 16px; font-weight: 600;
  margin-bottom: 16px;
}

/* Description */
.desc {
  font-size: clamp(15px, 1.5vw, 17px);
  color: var(--dim); line-height: 1.6;
  max-width: 580px;
  margin-bottom: 24px;
}

/* Numbers row */
.nums {
  display: flex; gap: 40px; justify-content: center;
  flex-wrap: wrap; margin-bottom: 8px;
}
.num-block { text-align: center; }
.num-val {
  font-size: clamp(24px, 3vw, 44px);
  font-weight: 800; letter-spacing: -1.5px; line-height: 1;
}
.num-label {
  font-size: 10px; color: var(--faint); margin-top: 4px;
  font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;
}

/* -- DEPTH PROMPT -- */
.depth-prompt {
  margin-top: 20px;
  font-size: 13px; color: var(--dim);
  cursor: pointer; transition: all 0.25s;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 20px;
  border-radius: 980px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
}
.depth-prompt:hover { color: var(--text); background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
.depth-prompt .arrow {
  display: inline-block; transition: transform 0.3s;
}
.depth-prompt.expanded .arrow { transform: rotate(180deg); }

/* -- DETAIL VIEW (depth layer) -- */
.detail {
  width: 100%; max-width: 700px;
  margin-top: 24px;
  overflow: hidden;
  max-height: 0; opacity: 0;
  transition: max-height 0.5s cubic-bezier(0.25,1,0.5,1), opacity 0.4s ease;
}
.detail.open {
  max-height: 500px; opacity: 1;
}

.detail-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 1px; background: rgba(255,255,255,0.04);
  border-radius: 12px; overflow: hidden;
  text-align: left;
}
.detail-cell {
  background: rgba(255,255,255,0.02);
  padding: 20px;
}
.detail-cell-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 8px;
}
.detail-cell-text {
  font-size: 13px; color: var(--dim); line-height: 1.55;
}

/* Before/After metrics */
.detail-ba {
  display: flex; gap: 24px; margin-top: 16px;
  justify-content: center; flex-wrap: wrap;
}
.ba-item { text-align: center; }
.ba-before {
  font-size: 13px; color: var(--faint); font-weight: 600;
  text-decoration: line-through; margin-bottom: 2px;
}
.ba-after {
  font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
}
.ba-label {
  font-size: 9px; color: var(--faint); text-transform: uppercase;
  letter-spacing: 0.5px; margin-top: 2px;
}

/* -- CTA ROW -- */
.cta-row { display: flex; gap: 16px; margin-top: 24px; }
.cta-pill {
  font-size: 14px; font-weight: 500; text-decoration: none;
  padding: 12px 28px; border-radius: 980px; transition: all 0.2s;
}
.cta-primary { background: var(--accent); color: white; }
.cta-primary:hover { opacity: 0.85; }
.cta-ghost { color: var(--accent); border: 1px solid; background: transparent; }

/* -- CHAPTER INTERSTITIAL -- */
.interstitial-num {
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  margin-bottom: 12px;
}
.interstitial-line {
  width: 40px; height: 2px; margin: 0 auto 20px;
}

/* ══════════════════════════════════════
   CHAT (iMessage-style interview)
   ══════════════════════════════════════ */
.chat-container {
  position: absolute;
  top: 52px; bottom: 16px;
  left: 50%; transform: translateX(-50%);
  width: calc(100% - 96px); max-width: 520px;
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none;
  transition: opacity 0.35s ease;
}
.chat-container.active {
  opacity: 1; pointer-events: auto;
}

.chat-header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 4px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.chat-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: white;
  flex-shrink: 0;
}
.chat-header-name { font-size: 15px; font-weight: 600; }
.chat-header-status { font-size: 11px; color: #30d158; font-weight: 500; }

.chat-thread {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 20px 4px 8px;
  display: flex; flex-direction: column; gap: 6px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.chat-thread::-webkit-scrollbar { width: 0; }

.chat-bubble {
  max-width: 82%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14px; line-height: 1.5;
  animation: bubbleIn 0.3s ease both;
  word-wrap: break-word;
}
.chat-jacob {
  align-self: flex-start;
  background: rgba(255,255,255,0.1);
  border-bottom-left-radius: 4px;
  color: var(--text);
}
.chat-visitor {
  align-self: flex-end;
  background: #2997ff;
  border-bottom-right-radius: 4px;
  color: white;
  margin-top: 8px;
}

@keyframes bubbleIn {
  from { opacity: 0; transform: translateY(8px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Typing indicator */
.typing-bubble {
  padding: 12px 18px;
}
.typing-indicator {
  display: flex; gap: 5px;
}
.typing-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--dim);
  animation: typingBounce 1.4s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-5px); opacity: 1; }
}

/* Option pills */
.chat-options {
  flex-shrink: 0;
  padding: 12px 4px 4px;
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: flex-end;
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  pointer-events: none;
}
.chat-options.visible {
  opacity: 1; transform: translateY(0); pointer-events: auto;
}

.chat-option-pill {
  background: transparent;
  border: 1px solid rgba(41,151,255,0.5);
  color: var(--accent);
  padding: 9px 18px;
  border-radius: 980px;
  font-size: 13px; font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}
.chat-option-pill:hover {
  background: var(--accent); color: white;
  border-color: var(--accent);
}
.chat-option-pill:active {
  transform: scale(0.96);
}

/* Contact card at end of chat */
.chat-contact-card {
  display: flex; flex-direction: column; gap: 8px;
  padding: 4px 0;
  margin-top: 12px;
  align-self: flex-start;
  width: 100%; max-width: 280px;
  animation: bubbleIn 0.4s ease both;
}
.chat-contact-link {
  display: block;
  padding: 12px 20px;
  border-radius: 14px;
  text-decoration: none;
  font-size: 14px; font-weight: 500;
  text-align: center;
  transition: all 0.2s;
}
.chat-contact-link.primary {
  background: var(--accent); color: white;
}
.chat-contact-link.primary:hover { opacity: 0.85; }
.chat-contact-link.secondary {
  background: rgba(255,255,255,0.06); color: var(--text);
}
.chat-contact-link.secondary:hover { background: rgba(255,255,255,0.1); }

/* Chat input bar */
.chat-input-bar {
  flex-shrink: 0;
  padding: 8px 4px 4px;
  display: flex; gap: 8px; align-items: center;
}
.chat-input {
  flex: 1;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 10px 16px;
  font-size: 14px; font-family: var(--font);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.chat-input::placeholder { color: var(--faint); }
.chat-input:focus { border-color: rgba(255,255,255,0.2); }
.chat-send {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--accent);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.2s;
  flex-shrink: 0;
}
.chat-send:hover { opacity: 0.85; }
.chat-send svg { width: 16px; height: 16px; fill: white; }

/* Spacer between chat groups */
.chat-spacer { height: 10px; flex-shrink: 0; }

/* ══════════════════════════════════════
   BOTTOM: progress + dots + hint
   ══════════════════════════════════════ */
.bottom {
  padding: 12px 48px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}

.progress-track {
  width: 100%; max-width: 480px; height: 2px;
  background: rgba(255,255,255,0.08); border-radius: 1px;
  position: relative; cursor: pointer;
}
.progress-fill {
  height: 100%; border-radius: 1px;
  transition: width 0.5s cubic-bezier(0.25,1,0.5,1), background 0.6s ease;
  position: relative;
}
.progress-dot {
  position: absolute; right: -5px; top: -4px;
  width: 10px; height: 10px; border-radius: 50%;
  transition: background 0.6s ease;
}

.chapter-dots { display: flex; gap: 6px; align-items: center; }
.chapter-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--faint); cursor: pointer;
  transition: all 0.3s ease;
}
.chapter-dot.active { width: 20px; border-radius: 3px; }
.dot-divider {
  width: 1px; height: 12px; background: var(--faint);
  margin: 0 4px; opacity: 0.4;
}

.nav-hint {
  font-size: 10px; color: var(--faint); letter-spacing: 0.5px;
}

/* -- MOBILE -- */
@media (max-width: 700px) {
  .stage { padding: 56px 24px 16px; }
  .top, .bottom { padding-left: 24px; padding-right: 24px; }
  .nums { gap: 20px; }
  .detail-grid { grid-template-columns: 1fr; }
  .cta-row { flex-direction: column; width: 100%; max-width: 280px; }
  .cta-pill { text-align: center; }
  .detail-ba { gap: 16px; }
  .chat-container { width: calc(100% - 48px); }
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="top">
    <div class="top-name">Jacob Charendoff</div>
    <div class="top-right">
      <div class="top-depth-indicator" id="depthIndicator">DETAIL VIEW</div>
      <div class="top-chapter" id="chapterLabel"></div>
    </div>
  </div>

  <div class="content" id="content">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 class="headline" id="headline"></h1>
    <div class="role" id="role"></div>
    <p class="desc" id="desc"></p>
    <div class="nums" id="nums"></div>
    <div class="depth-prompt" id="depthPrompt" onclick="toggleDepth()">
      <span class="arrow">&#9660;</span> <span id="depthPromptText">Go deeper</span>
    </div>
    <div class="detail" id="detail"></div>
    <div class="cta-row" id="ctaRow"></div>
  </div>

  <!-- CHAT INTERFACE -->
  <div class="chat-container" id="chatContainer">
    <div class="chat-header">
      <div class="chat-avatar">JC</div>
      <div>
        <div class="chat-header-name">Jacob Charendoff</div>
        <div class="chat-header-status">Active now</div>
      </div>
    </div>
    <div class="chat-thread" id="chatThread"></div>
    <div class="chat-options" id="chatOptions"></div>
    <div class="chat-input-bar">
      <input type="text" class="chat-input" id="chatInput" placeholder="Or type your own question..." autocomplete="off">
      <button class="chat-send" id="chatSend" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="bottom">
  <div class="progress-track" id="progressTrack">
    <div class="progress-fill" id="progressFill">
      <div class="progress-dot" id="progressDot"></div>
    </div>
  </div>
  <div class="chapter-dots" id="chapterDots"></div>
  <div class="nav-hint" id="navHint">Scroll or use arrow keys to navigate</div>
</div>

// ══════════════════════════════════════
// BUILD DOTS
// ══════════════════════════════════════
var lastGroup = -1;
slides.forEach(function(s, i) {
  if (s.group !== lastGroup && lastGroup !== -1) {
    var div = document.createElement('div');
    div.className = 'dot-divider';
    chapterDots.appendChild(div);
  }
  lastGroup = s.group;
  var dot = document.createElement('div');
  dot.className = 'chapter-dot';
  dot.title = s.label;
  dot.dataset.index = i;
  dot.addEventListener('click', function() { goTo(i); });
  chapterDots.appendChild(dot);
});

// ══════════════════════════════════════
// RENDER
// ══════════════════════════════════════
var lastIndex = 0;
function render(index, animate) {
  if (animate === undefined) animate = true;
  var s = slides[index];
  depthOpen = false;
  var direction = index >= lastIndex ? 'up' : 'down';
  lastIndex = index;

  if (animate) {
    transitioning = true;
    var outClass = direction === 'up' ? 'slide-out-up' : 'slide-out-down';
    content.classList.add(outClass);
    if (chatActive) chatContainer.classList.remove('active');

    setTimeout(function() {
      content.classList.remove(outClass);
      var inClass = direction === 'up' ? 'slide-out-down' : 'slide-out-up';
      content.classList.add(inClass);
      fillContent(s);

      content.offsetHeight;
      if (s.type !== 'chat') {
        content.classList.remove(inClass);
      }
      setTimeout(function() { transitioning = false; }, 350);
    }, 300);
  } else {
    fillContent(s);
  }

  // Progress
  var pct = (index / (slides.length - 1)) * 100;
  progressFill.style.width = pct + '%';
  progressFill.style.background = s.color;
  progressDot.style.background = s.color;

  // Dots
  document.querySelectorAll('.chapter-dot').forEach(function(d) {
    var di = parseInt(d.dataset.index);
    d.classList.toggle('active', di === index);
    d.style.background = di === index ? s.color : '';
  });

  // Chapter label
  chapterLabel.textContent = (index + 1) + ' / ' + slides.length;

  // Accent + ambient glow
  document.documentElement.style.setProperty('--accent', s.color);
  var r = parseInt(s.color.slice(1,3), 16);
  var g = parseInt(s.color.slice(3,5), 16);
  var b = parseInt(s.color.slice(5,7), 16);
  document.querySelector('.stage').style.setProperty('--glow', 'rgba(' + r + ',' + g + ',' + b + ',0.05)');
}

function fillContent(s) {
  // -- CHAT SLIDE --
  if (s.type === 'chat') {
    chatActive = true;
    chatContainer.classList.add('active');
    navHint.textContent = 'Navigate back anytime';
    startChat();
    return;
  }

  // -- NORMAL SLIDES --
  chatActive = false;
  chatContainer.classList.remove('active');

  eyebrow.textContent = s.eyebrow;
  eyebrow.style.color = s.color;

  headline.innerHTML = s.headline.replace(/\n/g, '<br>');

  role.textContent = s.role;
  role.style.color = s.color;
  role.style.display = s.role ? '' : 'none';

  desc.textContent = s.desc;

  // Numbers
  nums.innerHTML = '';
  s.nums.forEach(function(n) {
    var block = document.createElement('div');
    block.className = 'num-block';
    var valDiv = document.createElement('div');
    valDiv.className = 'num-val';
    valDiv.style.color = s.color;
    valDiv.textContent = n.val;
    var labelDiv = document.createElement('div');
    labelDiv.className = 'num-label';
    labelDiv.textContent = n.label;
    block.appendChild(valDiv);
    block.appendChild(labelDiv);
    nums.appendChild(block);
  });

  // Depth prompt
  if (s.type === 'company' && s.detail) {
    depthPrompt.style.display = 'flex';
    depthPromptText.textContent = 'Go deeper';
    depthPrompt.classList.remove('expanded');
  } else {
    depthPrompt.style.display = 'none';
  }

  // Close detail
  detail.classList.remove('open');
  detail.innerHTML = '';
  depthIndicator.classList.remove('show');

  // CTA
  ctaRow.innerHTML = '';
  if (s.cta) {
    s.cta.forEach(function(c) {
      var a = document.createElement('a');
      a.href = c.href;
      a.className = 'cta-pill ' + (c.primary ? 'cta-primary' : 'cta-ghost');
      a.textContent = c.text;
      if (!c.primary && c.href.indexOf('http') === 0) a.target = '_blank';
      ctaRow.appendChild(a);
    });
  }

  // Nav hint
  if (s.type === 'company' && s.detail) {
    navHint.textContent = 'Scroll to navigate · Click "Go deeper" for the full story';
  } else {
    navHint.textContent = 'Scroll or use arrow keys to navigate';
  }
}

// CHAT ENGINE
// ══════════════════════════════════════
function startChat() {
  chatVisited.clear();
  chatThread.innerHTML = '';
  chatOptions.innerHTML = '';
  chatOptions.classList.remove('visible');

  setTimeout(function() {
    showTyping(function() {
      addMessage('jacob', chatTree.start.jacob);
      setTimeout(function() { showChatOptions(chatTree.start.options); }, 300);
    });
  }, 400);
}

function addMessage(sender, text) {
  var bubble = document.createElement('div');
  bubble.className = 'chat-bubble chat-' + sender;
  bubble.textContent = text;
  chatThread.appendChild(bubble);
  scrollChat();
}

function showTyping(callback) {
  var typing = document.createElement('div');
  typing.className = 'chat-bubble chat-jacob typing-bubble';
  typing.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  chatThread.appendChild(typing);
  scrollChat();

  var dur = 800 + Math.random() * 600;
  setTimeout(function() {
    typing.remove();
    callback();
  }, dur);
}

function scrollChat() {
  requestAnimationFrame(function() {
    chatThread.scrollTop = chatThread.scrollHeight;
  });
}

function showChatOptions(options) {
  chatOptions.innerHTML = '';
  chatOptions.classList.remove('visible');

  var filtered = options.filter(function(o) { return o.next === 'contact' || !chatVisited.has(o.next); });
  var toShow = filtered.length > 0 ? filtered : [{ text: "Let's connect →", next: 'contact' }];

  toShow.forEach(function(opt) {
    var pill = document.createElement('button');
    pill.className = 'chat-option-pill';
    pill.textContent = opt.text;
    pill.addEventListener('click', function() { handleChatOption(opt); });
    chatOptions.appendChild(pill);
  });

  setTimeout(function() { chatOptions.classList.add('visible'); }, 60);
}

function handleChatOption(opt) {
  chatOptions.classList.remove('visible');
  setTimeout(function() { chatOptions.innerHTML = ''; }, 300);

  setTimeout(function() {
    addMessage('visitor', opt.text);
    chatVisited.add(opt.next);

    var node = chatTree[opt.next];

    setTimeout(function() {
      showTyping(function() {
        addMessage('jacob', node.jacob);

        if (node.isEnd) {
          setTimeout(function() { showContactCard(); }, 400);
        } else {
          setTimeout(function() { showChatOptions(node.options); }, 350);
        }
      });
    }, 350);
  }, 100);
}

function matchFreeform(input) {
  var lower = input.toLowerCase();
  var best = null;
  var bestCount = 0;
  for (var i = 0; i < freeformResponses.length; i++) {
    var count = 0;
    for (var j = 0; j < freeformResponses[i].keys.length; j++) {
      if (lower.indexOf(freeformResponses[i].keys[j]) !== -1) count++;
    }
    if (count > bestCount) {
      bestCount = count;
      best = freeformResponses[i];
    }
  }
  return best ? best.response : null;
}

function handleFreeformInput() {
  var text = chatInput.value.trim();
  if (!text) return;

  chatInput.value = '';
  chatOptions.classList.remove('visible');
  chatOptions.innerHTML = '';

  addMessage('visitor', text);

  var matched = matchFreeform(text);

  setTimeout(function() {
    showTyping(function() {
      if (matched) {
        addMessage('jacob', matched);
        setTimeout(function() {
          showChatOptions([
            { text: "Tell me more", next: chatVisited.size < 3 ? 'why_you' : 'company_fit' },
            { text: "Let's connect →", next: 'contact' }
          ]);
        }, 350);
      } else {
        addMessage('jacob', "Good question. That's one I'd rather answer live. Reach out and let's talk.");
        setTimeout(function() { showContactCard(); }, 400);
      }
    });
  }, 350);
}

chatSend.addEventListener('click', handleFreeformInput);
chatInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    e.stopPropagation();
    handleFreeformInput();
  }
});

// Prevent keyboard nav from firing when typing in chat input
chatInput.addEventListener('keydown', function(e) {

});

// ======================================
// DEPTH TOGGLE
// ══════════════════════════════════════
function toggleDepth() {
  var s = slides[current];
  if (!s.detail) return;

  depthOpen = !depthOpen;

  if (depthOpen) {
    depthPrompt.classList.add('expanded');
    depthPromptText.textContent = 'Collapse';
    depthIndicator.classList.add('show');

    var html = '<div class="detail-grid">';
    s.detail.cells.forEach(function(c) {
      html += '<div class="detail-cell"><div class="detail-cell-label" style="color:' + c.color + '">' + c.label + '</div><div class="detail-cell-text">' + c.text + '</div></div>';
    });
    html += '</div>';

    if (s.detail.ba && s.detail.ba.length) {
      html += '<div class="detail-ba">';
      s.detail.ba.forEach(function(b) {
        html += '<div class="ba-item"><div class="ba-before">' + b.before + '</div><div class="ba-after" style="color:' + s.color + '">' + b.after + '</div><div class="ba-label">' + b.label + '</div></div>';
      });
      html += '</div>';
    }

    detail.innerHTML = html;
    requestAnimationFrame(function() { detail.classList.add('open'); });
  } else {
    depthPrompt.classList.remove('expanded');
    depthPromptText.textContent = 'Go deeper';
    depthIndicator.classList.remove('show');
    detail.classList.remove('open');
    setTimeout(function() { detail.innerHTML = ''; }, 400);
  }
}

// ══════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════
function goTo(index) {
  if (transitioning || index === current || index < 0 || index >= slides.length) return;
  current = index;
  render(current);
}

function next() { goTo(current + 1); }
function prev() { goTo(current - 1); }

// Scroll - accumulate delta for smooth trackpad support
window.addEventListener('wheel', function(e) {
  if (chatActive || transitioning) return;
  scrollAccum += e.deltaY;

  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(function() { scrollAccum = 0; }, 200);

  var threshold = 80;
  if (Math.abs(scrollAccum) >= threshold) {
    if (depthOpen && scrollAccum < 0) {
      toggleDepth();
    } else if (scrollAccum > 0) {
      next();
    } else {
      prev();
    }
    scrollAccum = 0;
  }
}, { passive: true });

// Arrow keys
window.addEventListener('keydown', function(e) {
  if (chatActive) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    if (depthOpen) { toggleDepth(); return; }
    next();
  }
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    e.preventDefault();
    if (depthOpen) { toggleDepth(); return; }
    prev();
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (slides[current].type === 'company') toggleDepth();
  }
});

// Progress track click
progressTrack.addEventListener('click', function(e) {
  var rect = progressTrack.getBoundingClientRect();
  var pct = (e.clientX - rect.left) / rect.width;
  var target = Math.round(pct * (slides.length - 1));
  goTo(target);
});

// Touch swipe
var touchStartY = 0;
window.addEventListener('touchstart', function(e) { touchStartY = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchend', function(e) {
  if (chatActive) return;
  var dy = touchStartY - e.changedTouches[0].clientY;
  if (Math.abs(dy) > 40) {
    if (dy > 0) next(); else prev();
  }
}, { passive: true });

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
render(0, false);
</script>
