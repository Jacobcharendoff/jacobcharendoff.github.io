<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jacob Charendoff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #000; --text: #f5f5f7; --dim: #86868b; --faint: #48484a;
  --font: 'Inter', -apple-system, sans-serif;
  --accent: #2997ff;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  user-select: none;
}

/* ======================================
   STAGE
   ====================================== */
.stage {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 56px 48px 20px;
  position: relative; overflow: hidden;
}

/* Top bar */
.top {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 16px 48px;
  display: flex; align-items: center; justify-content: space-between;
}
.top-name { font-size: 13px; font-weight: 600; color: var(--dim); }
.top-right { display: flex; align-items: center; gap: 16px; }
.top-chapter {
  font-size: 11px; color: var(--faint); font-weight: 500;
  letter-spacing: 1px; text-transform: uppercase;
}
.top-depth-indicator {
  font-size: 10px; color: var(--accent); font-weight: 600;
  letter-spacing: 0.5px;
  opacity: 0; transition: opacity 0.3s;
}
.top-depth-indicator.show { opacity: 1; }

/* ======================================
   CONTENT: morphs in place
   ====================================== */
.content {
  display: flex; flex-direction: column;
  align-items: center; gap: 0;
  transition: opacity 0.15s ease;
  max-width: 800px; width: 100%;
}
.content.transitioning { opacity: 0; }

/* Eyebrow */
.eyebrow {
  font-size: 12px; font-weight: 600;
  letter-spacing: 2px; text-transform: uppercase;
  margin-bottom: 16px;
}

/* Headline */
.headline {
  font-size: clamp(40px, 7vw, 88px);
  font-weight: 900; letter-spacing: -3px; line-height: 1.0;
  margin-bottom: 12px;
}

/* Role */
.role {
  font-size: 16px; font-weight: 600;
  margin-bottom: 16px;
}

/* Description */
.desc {
  font-size: clamp(15px, 1.5vw, 17px);
  color: var(--dim); line-height: 1.6;
  max-width: 580px;
  margin-bottom: 24px;
}

/* Numbers row */
.nums {
  display: flex; gap: 40px; justify-content: center;
  flex-wrap: wrap; margin-bottom: 8px;
}
.num-block { text-align: center; }
.num-val {
  font-size: clamp(24px, 3vw, 44px);
  font-weight: 800; letter-spacing: -1.5px; line-height: 1;
}
.num-label {
  font-size: 10px; color: var(--faint); margin-top: 4px;
  font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;
}

/* -- DEPTH PROMPT -- */
.depth-prompt {
  margin-top: 20px;
  font-size: 12px; color: var(--faint);
  cursor: pointer; transition: color 0.2s;
  display: flex; align-items: center; gap: 6px;
}
.depth-prompt:hover { color: var(--dim); }
.depth-prompt .arrow {
  display: inline-block; transition: transform 0.3s;
}
.depth-prompt.expanded .arrow { transform: rotate(180deg); }

/* -- DETAIL VIEW (depth layer) -- */
.detail {
  width: 100%; max-width: 700px;
  margin-top: 24px;
  overflow: hidden;
  max-height: 0; opacity: 0;
  transition: max-height 0.5s cubic-bezier(0.25,1,0.5,1), opacity 0.4s ease;
}
.detail.open {
  max-height: 500px; opacity: 1;
}

.detail-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 1px; background: rgba(255,255,255,0.04);
  border-radius: 12px; overflow: hidden;
  text-align: left;
}
.detail-cell {
  background: rgba(255,255,255,0.02);
  padding: 20px;
}
.detail-cell-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 8px;
}
.detail-cell-text {
  font-size: 13px; color: var(--dim); line-height: 1.55;
}

/* Before/After metrics */
.detail-ba {
  display: flex; gap: 24px; margin-top: 16px;
  justify-content: center; flex-wrap: wrap;
}
.ba-item { text-align: center; }
.ba-before {
  font-size: 13px; color: var(--faint); font-weight: 600;
  text-decoration: line-through; margin-bottom: 2px;
}
.ba-after {
  font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
}
.ba-label {
  font-size: 9px; color: var(--faint); text-transform: uppercase;
  letter-spacing: 0.5px; margin-top: 2px;
}

/* -- CTA ROW -- */
.cta-row { display: flex; gap: 16px; margin-top: 24px; }
.cta-pill {
  font-size: 14px; font-weight: 500; text-decoration: none;
  padding: 12px 28px; border-radius: 980px; transition: all 0.2s;
}
.cta-primary { background: var(--accent); color: white; }
.cta-primary:hover { opacity: 0.85; }
.cta-ghost { color: var(--accent); border: 1px solid; background: transparent; }

/* -- CHAPTER INTERSTITIAL -- */
.interstitial-num {
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  margin-bottom: 12px;
}
.interstitial-line {
  width: 40px; height: 2px; margin: 0 auto 20px;
}

/* ======================================
   CHAT (iMessage-style interview)
   ====================================== */
.chat-container {
  position: absolute;
  top: 52px; bottom: 16px;
  left: 50%; transform: translateX(-50%);
  width: calc(100% - 96px); max-width: 520px;
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none;
  transition: opacity 0.35s ease;
}
.chat-container.active {
  opacity: 1; pointer-events: auto;
}

.chat-header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 4px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.chat-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: white;
  flex-shrink: 0;
}
.chat-header-name { font-size: 15px; font-weight: 600; }
.chat-header-status { font-size: 11px; color: #30d158; font-weight: 500; }

.chat-thread {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 20px 4px 8px;
  display: flex; flex-direction: column; gap: 6px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.chat-thread::-webkit-scrollbar { width: 0; }

.chat-bubble {
  max-width: 82%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14px; line-height: 1.5;
  animation: bubbleIn 0.3s ease both;
  word-wrap: break-word;
}
.chat-jacob {
  align-self: flex-start;
  background: rgba(255,255,255,0.1);
  border-bottom-left-radius: 4px;
  color: var(--text);
}
.chat-visitor {
  align-self: flex-end;
  background: #2997ff;
  border-bottom-right-radius: 4px;
  color: white;
  margin-top: 8px;
}

@keyframes bubbleIn {
  from { opacity: 0; transform: translateY(8px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Typing indicator */
.typing-bubble {
  padding: 12px 18px;
}
.typing-indicator {
  display: flex; gap: 5px;
}
.typing-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--dim);
  animation: typingBounce 1.4s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-5px); opacity: 1; }
}

/* Option pills */
.chat-options {
  flex-shrink: 0;
  padding: 12px 4px 4px;
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: flex-end;
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  pointer-events: none;
}
.chat-options.visible {
  opacity: 1; transform: translateY(0); pointer-events: auto;
}

.chat-option-pill {
  background: transparent;
  border: 1px solid rgba(41,151,255,0.5);
  color: var(--accent);
  padding: 9px 18px;
  border-radius: 980px;
  font-size: 13px; font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}
.chat-option-pill:hover {
  background: var(--accent); color: white;
  border-color: var(--accent);
}
.chat-option-pill:active {
  transform: scale(0.96);
}

/* Contact card at end of chat */
.chat-contact-card {
  display: flex; flex-direction: column; gap: 8px;
  padding: 4px 0;
  margin-top: 12px;
  align-self: flex-start;
  width: 100%; max-width: 280px;
  animation: bubbleIn 0.4s ease both;
}
.chat-contact-link {
  display: block;
  padding: 12px 20px;
  border-radius: 14px;
  text-decoration: none;
  font-size: 14px; font-weight: 500;
  text-align: center;
  transition: all 0.2s;
}
.chat-contact-link.primary {
  background: var(--accent); color: white;
}
.chat-contact-link.primary:hover { opacity: 0.85; }
.chat-contact-link.secondary {
  background: rgba(255,255,255,0.06); color: var(--text);
}
.chat-contact-link.secondary:hover { background: rgba(255,255,255,0.1); }

/* Spacer between chat groups */
.chat-spacer { height: 10px; flex-shrink: 0; }

/* ======================================
   BOTTOM: progress + dots + hint
   ====================================== */
.bottom {
  padding: 12px 48px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}

.progress-track {
  width: 100%; max-width: 480px; height: 2px;
  background: rgba(255,255,255,0.08); border-radius: 1px;
  position: relative; cursor: pointer;
}
.progress-fill {
  height: 100%; border-radius: 1px;
  transition: width 0.5s cubic-bezier(0.25,1,0.5,1), background 0.6s ease;
  position: relative;
}
.progress-dot {
  position: absolute; right: -5px; top: -4px;
  width: 10px; height: 10px; border-radius: 50%;
  transition: background 0.6s ease;
}

.chapter-dots { display: flex; gap: 6px; align-items: center; }
.chapter-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--faint); cursor: pointer;
  transition: all 0.3s ease;
}
.chapter-dot.active { width: 20px; border-radius: 3px; }
.dot-divider {
  width: 1px; height: 12px; background: var(--faint);
  margin: 0 4px; opacity: 0.4;
}

.nav-hint {
  font-size: 10px; color: var(--faint); letter-spacing: 0.5px;
}

/* -- MOBILE -- */
@media (max-width: 700px) {
  .stage { padding: 56px 24px 16px; }
  .top, .bottom { padding-left: 24px; padding-right: 24px; }
  .nums { gap: 20px; }
  .detail-grid { grid-template-columns: 1fr; }
  .cta-row { flex-direction: column; width: 100%; max-width: 280px; }
  .cta-pill { text-align: center; }
  .detail-ba { gap: 16px; }
  .chat-container { width: calc(100% - 48px); }
}
</style>
</head>

      { text: "Let's connect →", next: 'contact' }
    ]
  },
  failure: {
    jacob: "The Rig Doctor. I held on six months too long before selling. I was emotionally attached to something I'd built and it cost me margin on the exit. Still got 4x EBITDA, but I left money on the table because I couldn't separate the founder from the operator. That's the lesson I carry now. The numbers tell you when to move. Listen to them.",
    options: [
      { text: "What's your management style?", next: 'management' },
      { text: "Let's connect →", next: 'contact' }
    ]
  },
  management: {
    jacob: "I hire people who are better than me at their specific thing. Give them the system, the targets, and the room to run. I set the commercial architecture and the cadence, make sure the data is clean, and get out of the way. When something breaks I'm in the weeds until it's fixed. Otherwise I'm building the next thing.",
    options: [
      { text: "What kind of company fits you?", next: 'company_fit' },
      { text: "Let's connect →", next: 'contact' }
    ]
  },
  company_fit: {
    jacob: "Somewhere between 'figured out the product' and 'figured out how to sell it.' That gap is where I live. I need a founder or exec team that knows they need commercial infrastructure but hasn't built it yet. Not a turnaround. A build.",
    options: [
      { text: "What would your first 90 days look like?", next: 'ninety_days' },
      { text: "Let's connect →", next: 'contact' }
    ]
  },
  contact: {
    jacob: "Let's do it.",
    isEnd: true
  }
};

// ======================================
// STATE
// ======================================
var current = 0;
var depthOpen = false;
var transitioning = false;
var scrollCooldown = false;
var chatActive = false;
var chatVisited = new Set();

var content = document.getElementById('content');
var eyebrow = document.getElementById('eyebrow');
var headline = document.getElementById('headline');
var role = document.getElementById('role');
var desc = document.getElementById('desc');
var nums = document.getElementById('nums');
var ctaRow = document.getElementById('ctaRow');
var detail = document.getElementById('detail');
var depthPrompt = document.getElementById('depthPrompt');
var depthPromptText = document.getElementById('depthPromptText');
var depthIndicator = document.getElementById('depthIndicator');
var chapterLabel = document.getElementById('chapterLabel');
var progressFill = document.getElementById('progressFill');
var progressDot = document.getElementById('progressDot');
var chapterDots = document.getElementById('chapterDots');
var progressTrack = document.getElementById('progressTrack');
var navHint = document.getElementById('navHint');
var chatContainer = document.getElementById('chatContainer');
var chatThread = document.getElementById('chatThread');
var chatOptions = document.getElementById('chatOptions');

// ======================================
// BUILD DOTS
// ======================================
var lastGroup = -1;
slides.forEach(function(s, i) {
  if (s.group !== lastGroup && lastGroup !== -1) {
    var div = document.createElement('div');
    div.className = 'dot-divider';
    chapterDots.appendChild(div);
  }
  lastGroup = s.group;
  var dot = document.createElement('div');
  dot.className = 'chapter-dot';
  dot.title = s.label;
  dot.dataset.index = i;
  dot.addEventListener('click', function() { goTo(i); });
  chapterDots.appendChild(dot);
});

// ======================================
// RENDER
// ======================================
function render(index, animate) {
  if (animate === undefined) animate = true;
  var s = slides[index];
  depthOpen = false;

  if (animate) {
    transitioning = true;
    content.classList.add('transitioning');
    if (chatActive) chatContainer.classList.remove('active');

    setTimeout(function() {
      fillContent(s);
      if (s.type !== 'chat') {
        content.classList.remove('transitioning');
      }
      setTimeout(function() { transitioning = false; }, 200);
    }, 150);
  } else {
    fillContent(s);
  }

  var pct = (index / (slides.length - 1)) * 100;
  progressFill.style.width = pct + '%';
  progressFill.style.background = s.color;
  progressDot.style.background = s.color;

  document.querySelectorAll('.chapter-dot').forEach(function(d) {
    var di = parseInt(d.dataset.index);
    d.classList.toggle('active', di === index);
    d.style.background = di === index ? s.color : '';
  });

  chapterLabel.textContent = (index + 1) + ' / ' + slides.length;
  document.documentElement.style.setProperty('--accent', s.color);
}

function fillContent(s) {
  if (s.type === 'chat') {
    chatActive = true;
    chatContainer.classList.add('active');
    navHint.textContent = 'Navigate back anytime';
    startChat();
    return;
  }

  chatActive = false;
  chatContainer.classList.remove('active');

  eyebrow.textContent = s.eyebrow;
  eyebrow.style.color = s.color;
  headline.innerHTML = s.headline.replace(/\n/g, '<br>');
  role.textContent = s.role;
  role.style.color = s.color;
  role.style.display = s.role ? '' : 'none';
  desc.textContent = s.desc;

  nums.innerHTML = '';
  s.nums.forEach(function(n) {
    var block = document.createElement('div');
    block.className = 'num-block';
    block.innerHTML = '<div class="num-val" style="color:' + s.color + '">' + n.val + '</div><div class="num-label">' + n.label + '</div>';
    nums.appendChild(block);
  });

  if (s.type === 'company' && s.detail) {
    depthPrompt.style.display = 'flex';
    depthPromptText.textContent = 'Go deeper';
    depthPrompt.classList.remove('expanded');
  } else {
    depthPrompt.style.display = 'none';
  }

  detail.classList.remove('open');
  detail.innerHTML = '';
  depthIndicator.classList.remove('show');

  ctaRow.innerHTML = '';
  if (s.cta) {
    s.cta.forEach(function(c) {
      var a = document.createElement('a');
      a.href = c.href;
      a.className = 'cta-pill ' + (c.primary ? 'cta-primary' : 'cta-ghost');
      a.textContent = c.text;
      if (!c.primary && c.href.startsWith('http')) a.target = '_blank';
      ctaRow.appendChild(a);
    });
  }

  if (s.type === 'company' && s.detail) {
    navHint.textContent = 'Scroll to navigate · Click "Go deeper" for the full story';
  } else {
    navHint.textContent = 'Scroll or use arrow keys to navigate';
  }
}

// ======================================
// CHAT ENGINE
// ======================================
function startChat() {
  chatVisited.clear();
  chatThread.innerHTML = '';
  chatOptions.innerHTML = '';
  chatOptions.classList.remove('visible');

  setTimeout(function() {
    showTyping(function() {
      addMessage('jacob', chatTree.start.jacob);
      setTimeout(function() { showChatOptions(chatTree.start.options); }, 300);
    });
  }, 400);
}

function addMessage(sender, text) {
  var bubble = document.createElement('div');
  bubble.className = 'chat-bubble chat-' + sender;
  bubble.textContent = text;
  chatThread.appendChild(bubble);
  scrollChat();
}

function showTyping(callback) {
  var typing = document.createElement('div');
  typing.className = 'chat-bubble chat-jacob typing-bubble';
  typing.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  chatThread.appendChild(typing);
  scrollChat();

  var dur = 800 + Math.random() * 600;
  setTimeout(function() {
    typing.remove();
    callback();
  }, dur);
}

function scrollChat() {
  requestAnimationFrame(function() {
    chatThread.scrollTop = chatThread.scrollHeight;
  });
}

function showChatOptions(options) {
  chatOptions.innerHTML = '';
  chatOptions.classList.remove('visible');

  var filtered = options.filter(function(o) { return o.next === 'contact' || !chatVisited.has(o.next); });
  var toShow = filtered.length > 0 ? filtered : [{ text: "Let's connect →", next: 'contact' }];

  toShow.forEach(function(opt) {
    var pill = document.createElement('button');
    pill.className = 'chat-option-pill';
    pill.textContent = opt.text;
    pill.addEventListener('click', function() { handleChatOption(opt); });
    chatOptions.appendChild(pill);
  });

  setTimeout(function() { chatOptions.classList.add('visible'); }, 60);
}

function handleChatOption(opt) {
  chatOptions.classList.remove('visible');
  setTimeout(function() { chatOptions.innerHTML = ''; }, 300);

  setTimeout(function() {
    addMessage('visitor', opt.text);
    chatVisited.add(opt.next);

    var node = chatTree[opt.next];

    setTimeout(function() {
      showTyping(function() {
        addMessage('jacob', node.jacob);

        if (node.isEnd) {
          setTimeout(function() { showContactCard(); }, 400);
        } else {
          setTimeout(function() { showChatOptions(node.options); }, 350);
        }
      });
    }, 350);
  }, 100);
}

function showContactCard() {
  var card = document.createElement('div');
  card.className = 'chat-contact-card';
  card.innerHTML = '<a href="mailto:jacobcharendoff@gmail.com" class="chat-contact-link primary">jacobcharendoff@gmail.com</a><a href="https://linkedin.com/in/jacob-charendoff" target="_blank" class="chat-contact-link secondary">LinkedIn</a><a href="tel:+16476802324" class="chat-contact-link secondary">(647) 680-2324</a>';
  chatThread.appendChild(card);
  scrollChat();
}

// ======================================
// DEPTH TOGGLE
// ======================================
function toggleDepth() {
  var s = slides[current];
  if (!s.detail) return;

  depthOpen = !depthOpen;

  if (depthOpen) {
    depthPrompt.classList.add('expanded');
    depthPromptText.textContent = 'Collapse';
    depthIndicator.classList.add('show');

    var html = '<div class="detail-grid">';
    s.detail.cells.forEach(function(c) {
      html += '<div class="detail-cell"><div class="detail-cell-label" style="color:' + c.color + '">' + c.label + '</div><div class="detail-cell-text">' + c.text + '</div></div>';
    });
    html += '</div>';

    if (s.detail.ba && s.detail.ba.length) {
      html += '<div class="detail-ba">';
      s.detail.ba.forEach(function(b) {
        html += '<div class="ba-item"><div class="ba-before">' + b.before + '</div><div class="ba-after" style="color:' + s.color + '">' + b.after + '</div><div class="ba-label">' + b.label + '</div></div>';
      });
      html += '</div>';
    }

    detail.innerHTML = html;
    requestAnimationFrame(function() { detail.classList.add('open'); });
  } else {
    depthPrompt.classList.remove('expanded');
    depthPromptText.textContent = 'Go deeper';
    depthIndicator.classList.remove('show');
    detail.classList.remove('open');
    setTimeout(function() { detail.innerHTML = ''; }, 400);
  }
}

// ======================================
// NAVIGATION
// ======================================
function goTo(index) {
  if (transitioning || index === current || index < 0 || index >= slides.length) return;
  current = index;
  render(current);
}

function next() { goTo(current + 1); }
function prev() { goTo(current - 1); }

window.addEventListener('wheel', function(e) {
  if (chatActive || scrollCooldown || transitioning) return;
  if (depthOpen && e.deltaY < -20) {
    scrollCooldown = true;
    toggleDepth();
    setTimeout(function() { scrollCooldown = false; }, 500);
    return;
  }
  scrollCooldown = true;
  if (e.deltaY > 20) next();
  else if (e.deltaY < -20) prev();
  setTimeout(function() { scrollCooldown = false; }, 600);
}, { passive: true });

window.addEventListener('keydown', function(e) {
  if (chatActive) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    if (depthOpen) { toggleDepth(); return; }
    next();
  }
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    e.preventDefault();
    if (depthOpen) { toggleDepth(); return; }
    prev();
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (slides[current].type === 'company') toggleDepth();
  }
});

progressTrack.addEventListener('click', function(e) {
  var rect = progressTrack.getBoundingClientRect();
  var pct = (e.clientX - rect.left) / rect.width;
  var target = Math.round(pct * (slides.length - 1));
  goTo(target);
});

var touchStartY = 0;
window.addEventListener('touchstart', function(e) { touchStartY = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchend', function(e) {
  if (chatActive) return;
  var dy = touchStartY - e.changedTouches[0].clientY;
  if (Math.abs(dy) > 40) {
    if (dy > 0) next(); else prev();
  }
}, { passive: true });

// ======================================
// INIT
// ======================================
render(0, false);
</script>
