<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jacob Charendoff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #000; --text: #f5f5f7; --dim: #a1a1a6; --faint: #6e6e73;
  --font: 'Inter', -apple-system, sans-serif;
  --accent: #2997ff;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  user-select: none;
  transition: background 0.8s ease;
}

/* Allow text selection in chat and contact areas */
.chat-container { user-select: text; }
.chat-contact-card { user-select: text; }
.chat-bubble { user-select: text;
}

/* STAGE */
.stage {
  flex: 1; display: flex; flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 56px 48px 20px;
  position: relative;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.stage::-webkit-scrollbar { width: 0; }
.stage::before {
  content: '';
  position: absolute;
  top: 30%; left: 50%; transform: translate(-50%, -50%);
  width: 600px; height: 400px;
  background: radial-gradient(ellipse, var(--glow, rgba(41,151,255,0.06)) 0%, transparent 70%);
  pointer-events: none;
  transition: background 0.8s ease;
  z-index: 0;
}
.stage > * { position: relative; z-index: 1; }

/* Top bar */
.top {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 16px 48px;
  display: flex; align-items: center; justify-content: space-between;
}
.top-name { font-size: 13px; font-weight: 600; color: var(--dim); }
.top-right { display: flex; align-items: center; gap: 16px; }
.top-chapter {
  font-size: 11px; color: var(--faint); font-weight: 500;
  letter-spacing: 1px; text-transform: uppercase;
}
.top-depth-indicator {
  font-size: 10px; color: var(--accent); font-weight: 600;
  letter-spacing: 0.5px;
  opacity: 0; transition: opacity 0.3s;
}
.top-depth-indicator.show { opacity: 1; }

/* CONTENT */
.content {
  display: flex; flex-direction: column;
  align-items: center; gap: 0;
  transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  max-width: 800px; width: 100%;
  margin: auto 0;
}
.content.slide-out-up { opacity: 0; transform: translateY(-30px); }
.content.slide-out-down { opacity: 0; transform: translateY(30px); }

.eyebrow {
  font-size: 12px; font-weight: 600;
  letter-spacing: 2px; text-transform: uppercase;
  margin-bottom: 16px;
}

.headline {
  font-size: clamp(40px, 7vw, 88px);
  font-weight: 900; letter-spacing: -3px; line-height: 1.0;
  margin-bottom: 12px;
}

.role {
  font-size: 16px; font-weight: 600;
  margin-bottom: 16px;
}

.desc {
  font-size: clamp(15px, 1.5vw, 17px);
  color: var(--dim); line-height: 1.6;
  max-width: 580px;
  margin-bottom: 24px;
}

.nums {
  display: flex; gap: 40px; justify-content: center;
  flex-wrap: wrap; margin-bottom: 8px;
}
.num-block { text-align: center; }
.num-val {
  font-size: clamp(24px, 3vw, 44px);
  font-weight: 800; letter-spacing: -1.5px; line-height: 1;
}
.num-label {
  font-size: 10px; color: var(--faint); margin-top: 4px;
  font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;
}

.depth-prompt {
  margin-top: 20px;
  font-size: 13px; color: var(--dim);
  cursor: pointer; transition: all 0.25s;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 20px;
  border-radius: 980px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
}
.depth-prompt:hover { color: var(--text); background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
.depth-prompt .arrow {
  display: inline-block; transition: transform 0.3s;
}
.depth-prompt.expanded .arrow { transform: rotate(180deg); }

.detail {
  width: 100%; max-width: 700px;
  margin-top: 24px;
  overflow: hidden;
  max-height: 0; opacity: 0;
  transition: max-height 0.5s cubic-bezier(0.25,1,0.5,1), opacity 0.4s ease;
}
.detail.open {
  max-height: 700px; opacity: 1;
}

.detail-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 1px; background: rgba(255,255,255,0.04);
  border-radius: 12px; overflow: hidden;
  text-align: left;
}
.detail-cell {
  background: rgba(255,255,255,0.02);
  padding: 20px;
}
.detail-cell-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 8px;
}
.detail-cell-text {
  font-size: 13px; color: var(--dim); line-height: 1.55;
}

.detail-ba {
  display: flex; gap: 24px; margin-top: 16px;
  justify-content: center; flex-wrap: wrap;
}
.ba-item { text-align: center; }
.ba-before {
  font-size: 13px; color: var(--faint); font-weight: 600;
  text-decoration: line-through; margin-bottom: 2px;
}
.ba-after {
  font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
}
.ba-label {
  font-size: 9px; color: var(--faint); text-transform: uppercase;
  letter-spacing: 0.5px; margin-top: 2px;
}

.cta-row { display: flex; gap: 16px; margin-top: 24px; }
.cta-pill {
  font-size: 14px; font-weight: 500; text-decoration: none;
  padding: 12px 28px; border-radius: 980px; transition: all 0.2s;
}
.cta-primary { background: var(--accent); color: white; }
.cta-primary:hover { opacity: 0.85; }
.cta-ghost { color: var(--accent); border: 1px solid; background: transparent; }

.interstitial-num {
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  margin-bottom: 12px;
}
.interstitial-line {
  width: 40px; height: 2px; margin: 0 auto 20px;
}

/* CHAT */
.chat-container {
  position: absolute;
  top: 52px; bottom: 16px;
  left: 50%; transform: translateX(-50%);
  width: calc(100% - 96px); max-width: 520px;
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none;
  transition: opacity 0.35s ease;
}
.chat-container.active {
  opacity: 1; pointer-events: auto;
}

.chat-header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 4px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.chat-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: white;
  flex-shrink: 0;
}
.chat-header-name { font-size: 15px; font-weight: 600; }
.chat-header-status { font-size: 11px; color: #30d158; font-weight: 500; }

.chat-thread {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 20px 4px 8px;
  display: flex; flex-direction: column; gap: 6px;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.chat-thread::-webkit-scrollbar { width: 0; }

.chat-bubble {
  max-width: 82%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14px; line-height: 1.5;
  animation: bubbleIn 0.3s ease both;
  word-wrap: break-word;
}
.chat-jacob {
  align-self: flex-start;
  background: rgba(255,255,255,0.1);
  border-bottom-left-radius: 4px;
  color: var(--text);
}
.chat-visitor {
  align-self: flex-end;
  background: #2997ff;
  border-bottom-right-radius: 4px;
  color: white;
  margin-top: 8px;
}

@keyframes bubbleIn {
  from { opacity: 0; transform: translateY(8px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.typing-bubble {
  padding: 12px 18px;
}
.typing-indicator {
  display: flex; gap: 5px;
}
.typing-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--dim);
  animation: typingBounce 1.4s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-5px); opacity: 1; }
}

.chat-options {
  flex-shrink: 0;
  padding: 12px 4px 4px;
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: flex-end;
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  pointer-events: none;
}
.chat-options.visible {
  opacity: 1; transform: translateY(0); pointer-events: auto;
}

.chat-option-pill {
  background: transparent;
  border: 1px solid rgba(41,151,255,0.5);
  color: var(--accent);
  padding: 9px 18px;
  border-radius: 980px;
  font-size: 13px; font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}
.chat-option-pill:hover {
  background: var(--accent); color: white;
  border-color: var(--accent);
}
.chat-option-pill:active {
  transform: scale(0.96);
}

.chat-contact-card {
  display: flex; flex-direction: column; gap: 8px;
  padding: 4px 0;
  margin-top: 12px;
  align-self: flex-start;
  width: 100%; max-width: 280px;
  animation: bubbleIn 0.4s ease both;
}
.chat-contact-link {
  display: block;
  padding: 12px 20px;
  border-radius: 14px;
  text-decoration: none;
  font-size: 14px; font-weight: 500;
  text-align: center;
  transition: all 0.2s;
}
.chat-contact-link.primary {
  background: var(--accent); color: white;
}
.chat-contact-link.primary:hover { opacity: 0.85; }
.chat-contact-link.secondary {
  background: rgba(255,255,255,0.06); color: var(--text);
}
.chat-contact-link.secondary:hover { background: rgba(255,255,255,0.1); }

.chat-input-bar {
  flex-shrink: 0;
  padding: 8px 4px 4px;
  display: flex; gap: 8px; align-items: center;
}
.chat-input {
  flex: 1;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 10px 16px;
  font-size: 14px; font-family: var(--font);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.chat-input::placeholder { color: var(--faint); }
.chat-input:focus { border-color: rgba(255,255,255,0.2); }
.chat-send {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--accent);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.2s;
  flex-shrink: 0;
}
.chat-send:hover { opacity: 0.85; }
.chat-send svg { width: 16px; height: 16px; fill: white; }

.chat-spacer { height: 10px; flex-shrink: 0; }

/* BOTTOM */
.bottom {
  padding: 12px 48px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}

.progress-track {
  width: 100%; max-width: 480px; height: 2px;
  background: rgba(255,255,255,0.08); border-radius: 1px;
  position: relative; cursor: pointer;
}
.progress-fill {
  height: 100%; border-radius: 1px;
  transition: width 0.5s cubic-bezier(0.25,1,0.5,1), background 0.6s ease;
  position: relative;
}
.progress-dot {
  position: absolute; right: -5px; top: -4px;
  width: 10px; height: 10px; border-radius: 50%;
  transition: background 0.6s ease;
}

.chapter-dots { display: flex; gap: 4px; align-items: center; }
.chapter-dot {
  font-size: 10px; font-weight: 500; letter-spacing: 0.3px;
  color: var(--faint); cursor: pointer;
  padding: 4px 8px; border-radius: 980px;
  transition: all 0.3s ease;
  white-space: nowrap;
}
.chapter-dot:hover { color: var(--dim); }
.chapter-dot.active { color: var(--text); background: rgba(255,255,255,0.08); font-weight: 600; }
.dot-divider {
  width: 1px; height: 12px; background: var(--faint);
  margin: 0 2px; opacity: 0.4;
}

.nav-hint {
  font-size: 10px; color: var(--faint); letter-spacing: 0.5px;
}

.scroll-indicator {
  position: absolute; bottom: 80px; left: 50%;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  opacity: 0; animation: scrollFadeIn 1s 1.2s ease both;
  cursor: pointer; transition: opacity 0.4s;
}
.scroll-indicator.hidden { opacity: 0; pointer-events: none; }
.scroll-indicator-text {
  font-size: 11px; color: var(--faint); letter-spacing: 1px;
  text-transform: uppercase; font-weight: 500;
}
.scroll-indicator-chevron {
  width: 20px; height: 20px;
  border-right: 2px solid var(--faint); border-bottom: 2px solid var(--faint);
  transform: rotate(45deg);
  animation: chevronBounce 2s infinite;
}
@keyframes scrollFadeIn {
  from { opacity: 0; transform: translateX(-50%) translateY(8px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes chevronBounce {
  0%, 100% { transform: rotate(45deg) translateY(0); }
  50% { transform: rotate(45deg) translateY(4px); }
}

.chat-float {
  position: fixed; bottom: 100px; right: 32px;
  background: var(--accent); color: white;
  font-family: var(--font); font-size: 13px; font-weight: 600;
  padding: 10px 20px; border-radius: 980px;
  border: none; cursor: pointer;
  z-index: 100;
  box-shadow: 0 4px 20px rgba(41,151,255,0.3);
  transition: all 0.3s ease;
  opacity: 0; transform: translateY(10px);
  pointer-events: none;
}
.chat-float.visible {
  opacity: 1; transform: translateY(0); pointer-events: auto;
}
.chat-float:hover {
  box-shadow: 0 6px 28px rgba(41,151,255,0.45);
  transform: translateY(-2px);
}

.contact-row {
  display: flex; gap: 20px; justify-content: center;
  flex-wrap: wrap; margin-bottom: 16px;
  user-select: text;
}
.contact-link {
  font-size: 13px; color: var(--dim);
  text-decoration: none; font-weight: 500;
  transition: color 0.2s;
  letter-spacing: 0.3px;
}
.contact-link:hover { color: var(--text); }
.contact-sep { color: var(--faint); font-size: 13px; user-select: none; }

.nav-cards {
  display: flex; gap: 8px; flex-wrap: wrap;
  justify-content: center; margin-top: 20px;
}
.nav-card {
  font-size: 12px; font-weight: 600;
  padding: 10px 20px; border-radius: 980px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.03);
  color: var(--dim); cursor: pointer;
  transition: all 0.2s; font-family: var(--font);
}
.nav-card:hover {
  background: rgba(255,255,255,0.08);
  color: var(--text);
  border-color: rgba(255,255,255,0.2);
}
.nav-card.accent {
  background: var(--accent); color: white;
  border-color: var(--accent);
}
.nav-card.accent:hover { opacity: 0.85; }

.chapter-dot:focus-visible,
.chat-option-pill:focus-visible,
.depth-prompt:focus-visible,
.cta-pill:focus-visible,
.chat-send:focus-visible,
.chat-float:focus-visible {
  outline: 2px solid rgba(41,151,255,0.6);
  outline-offset: 2px;
}
.chat-input:focus-visible {
  border-color: var(--accent);
  outline: none;
}

.progress-track:hover .progress-fill { filter: brightness(1.2); }
.progress-track:hover { height: 4px; margin-top: -1px; }

.stage.loading .content { opacity: 0; }
.entrance-eyebrow { animation: entranceFade 0.6s 0.2s ease both; }
.entrance-headline { animation: entranceFade 0.7s 0.35s ease both; }
.entrance-contact { animation: entranceFade 0.6s 0.45s ease both; }
.entrance-desc { animation: entranceFade 0.6s 0.6s ease both; }
.entrance-nums { animation: entranceFade 0.6s 0.75s ease both; }
.entrance-nav { animation: entranceFade 0.6s 0.9s ease both; }
.entrance-depth { animation: entranceFade 0.5s 1.0s ease both; }
@keyframes entranceFade {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.content.touch-dragging {
  transition: none;
}

@media (max-width: 700px) {
  .stage { padding: 56px 24px 16px; }
  .top, .bottom { padding-left: 24px; padding-right: 24px; }
  .nums { gap: 20px; }
  .detail-grid { grid-template-columns: 1fr; }
  .cta-row { flex-direction: column; width: 100%; max-width: 280px; }
  .cta-pill { text-align: center; }
  .detail-ba { gap: 16px; }
  .chat-container { width: calc(100% - 48px); }
  .chapter-dots { gap: 2px; flex-wrap: wrap; justify-content: center; }
  .chapter-dot { font-size: 9px; padding: 3px 6px; }
  .chat-float { right: 20px; bottom: 90px; font-size: 12px; padding: 8px 16px; }
  .scroll-indicator { bottom: 70px; }
  .nav-cards { gap: 6px; }
  .nav-card { font-size: 11px; padding: 8px 14px; }
  .contact-row { gap: 12px; }
  .contact-link { font-size: 12px; }
}
@media (max-width: 400px) {
  .chapter-dot.compact-hide { display: none; }
  .chapter-dots { gap: 1px; }
  .chapter-dot { font-size: 8px; padding: 2px 5px; }
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="top">
    <div class="top-name" style="cursor:pointer" onclick="goTo(0)">Jacob Charendoff</div>
    <div class="top-right">
      <a href="case-studies.html" style="font-size:12px;font-weight:600;letter-spacing:.3px;color:var(--accent);text-decoration:none;border:1px solid rgba(41,151,255,0.4);padding:5px 12px;border-radius:8px;">Case Studies &#8594;</a>
      <div class="top-depth-indicator" id="depthIndicator">DETAIL VIEW</div>
      <div class="top-chapter" id="chapterLabel"></div>
    </div>
  </div>

  <div class="content" id="content">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 class="headline" id="headline"></h1>
    <div class="role" id="role"></div>
    <div class="contact-row" id="contactRow"></div>
    <p class="desc" id="desc"></p>
    <div class="nums" id="nums"></div>
    <div class="nav-cards" id="navCards"></div>
    <div class="depth-prompt" id="depthPrompt" onclick="toggleDepth()">
      <span class="arrow">&#9660;</span> <span id="depthPromptText">Go deeper</span>
    </div>
    <div class="detail" id="detail"></div>
    <div class="cta-row" id="ctaRow"></div>
  </div>

  <div class="scroll-indicator" id="scrollIndicator" onclick="next()">
    <span class="scroll-indicator-text">Scroll to explore</span>
    <div class="scroll-indicator-chevron"></div>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="chat-header">
      <div class="chat-avatar">JC</div>
      <div>
        <div class="chat-header-name">Jacob Charendoff</div>
        <div class="chat-header-status">Active now</div>
      </div>
    </div>
    <div class="chat-thread" id="chatThread"></div>
    <div class="chat-options" id="chatOptions"></div>
    <div class="chat-input-bar">
      <input type="text" class="chat-input" id="chatInput" placeholder="Or type your own question..." autocomplete="off">
      <button class="chat-send" id="chatSend" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<button class="chat-float" id="chatFloat" onclick="goTo(slides.length - 1)">Start a Virtual Interview</button>

<div class="bottom">
  <div class="progress-track" id="progressTrack">
    <div class="progress-fill" id="progressFill">
      <div class="progress-dot" id="progressDot"></div>
    </div>
  </div>
  <div class="chapter-dots" id="chapterDots"></div>
  <div class="nav-hint" id="navHint">Scroll or use arrow keys to navigate</div>
</div>

<script>
const slides = [
  {
    type: 'intro',
    eyebrow: 'Revenue & Growth Leader',
    headline: 'Jacob\nCharendoff',
    role: '',
    desc: 'I build the commercial systems that turn ambition into pipeline, pipeline into revenue, and revenue into exits.',
    nums: [
      { val: '12+', label: 'Years' },
      { val: '3', label: 'Exits' },
      { val: '4', label: 'Industries' }
    ],
    color: '#2997ff',
    label: 'Intro',
    group: 0
  },

  {
    type: 'chapter',
    eyebrow: 'CHAPTER 01',
    headline: 'The Operator\n& Founder Years',
    role: '',
    desc: 'Hired pre-revenue at a family-backed portfolio. Climbed from the first sales hire to VP. Built a company on the side and sold it. Eight years learning what makes businesses actually grow.',
    nums: [],
    color: '#ff9f0a',
    label: 'Ch. 1',
    group: 1
  },

  {
    type: 'company',
    eyebrow: '2014 - 2022 / Manager → VP',
    headline: 'Berman\nVentures',
    role: 'Sales & Mktg Mgr → Dir. Ops → VP Revenue & Growth',
    desc: 'Employee #1. Hired pre-revenue to build the commercial engine for a portfolio spanning hospitality and health tech. Climbed from the first sales hire to VP over eight years. Both portfolio companies exited.',
    nums: [
      { val: '9 → 50+', label: 'Team Built' },
      { val: '2', label: 'Companies Exited' },
      { val: '8 yrs', label: 'Manager → VP' }
    ],
    color: '#ff9f0a',
    label: 'Berman',
    group: 1,

let lastGroup = -1;
slides.forEach((s, i) => {
  if (s.group !== lastGroup && lastGroup !== -1) {
    const div = document.createElement('div');
    div.className = 'dot-divider';
    chapterDots.appendChild(div);
  }
  lastGroup = s.group;
  const dot = document.createElement('div');
  dot.className = 'chapter-dot';
  dot.textContent = s.label;
  dot.dataset.index = i;
  dot.setAttribute('tabindex', '0');
  dot.setAttribute('role', 'button');
  dot.addEventListener('click', () => goTo(i));
  dot.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goTo(i); } });
  chapterDots.appendChild(dot);
});

let lastIndex = 0;
function render(index, animate = true) {
  const s = slides[index];
  depthOpen = false;
  const direction = index >= lastIndex ? 'up' : 'down';
  lastIndex = index;

  if (animate) {
    transitioning = true;
    const outClass = direction === 'up' ? 'slide-out-up' : 'slide-out-down';
    content.classList.add(outClass);
    if (chatActive) chatContainer.classList.remove('active');

    setTimeout(() => {
      content.classList.remove(outClass);
      const inClass = direction === 'up' ? 'slide-out-down' : 'slide-out-up';
      content.classList.add(inClass);
      fillContent(s);

      content.offsetHeight;
      if (s.type !== 'chat') {
        content.classList.remove(inClass);
      }
      setTimeout(() => { transitioning = false; }, 350);
    }, 300);
  } else {
    fillContent(s);
  }

  const pct = (index / (slides.length - 1)) * 100;
  progressFill.style.width = pct + '%';
  progressFill.style.background = s.color;
  progressDot.style.background = s.color;

  document.querySelectorAll('.chapter-dot').forEach(d => {
    const di = parseInt(d.dataset.index);
    d.classList.toggle('active', di === index);
    d.style.background = di === index ? s.color : '';
  });

  chapterLabel.textContent = s.label || '';

  if (typeof updateOverlays === 'function') updateOverlays();

  document.documentElement.style.setProperty('--accent', s.color);
  var r = parseInt(s.color.slice(1,3), 16);
  var g = parseInt(s.color.slice(3,5), 16);
  var b = parseInt(s.color.slice(5,7), 16);
  document.querySelector('.stage').style.setProperty('--glow', 'rgba(' + r + ',' + g + ',' + b + ',0.05)');
}

var CHAT_API_URL = 'https://portfolio-chat-api-flax.vercel.app/api/chat';
var conversationHistory = [];
var chatLocked = false;

function startChat() {
  chatThread.innerHTML = '';
  chatOptions.innerHTML = '';
  chatOptions.classList.remove('visible');
  conversationHistory = [];
  chatLocked = false;

  setTimeout(function() {
    showTyping(function() {
      addMessage('jacob', "Hey - Jacob here. What do you want to know?");
      setTimeout(function() { showSuggestions(suggestedStarters); }, 300);
    });
  }, 400);
}

function addMessage(sender, text) {
  var bubble = document.createElement('div');
  bubble.className = 'chat-bubble chat-' + sender;
  bubble.textContent = text;
  chatThread.appendChild(bubble);
  scrollChat();
}

function showTyping(callback) {
  var typing = document.createElement('div');
  typing.className = 'chat-bubble chat-jacob typing-bubble';
  typing.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  chatThread.appendChild(typing);
  scrollChat();
  var dur = 800 + Math.random() * 600;
  setTimeout(function() { typing.remove(); callback(); }, dur);
}

function scrollChat() {
  requestAnimationFrame(function() { chatThread.scrollTop = chatThread.scrollHeight; });
}

function showSuggestions(prompts) {
  chatOptions.innerHTML = '';
  chatOptions.classList.remove('visible');
  prompts.forEach(function(text) {
    var pill = document.createElement('button');
    pill.className = 'chat-option-pill';
    pill.textContent = text;
    pill.addEventListener('click', function() { sendChatMessage(text); });
    chatOptions.appendChild(pill);
  });
  setTimeout(function() { chatOptions.classList.add('visible'); }, 60);
}

function sendChatMessage(text) {
  if (chatLocked) return;

  if (text === "Let's connect →") {
    chatOptions.classList.remove('visible');
    setTimeout(function() { chatOptions.innerHTML = ''; }, 300);
    setTimeout(function() {
      addMessage('visitor', text);
      setTimeout(function() {
        showTyping(function() {
          addMessage('jacob', "Let's do it.");
          setTimeout(function() { showContactCard(); }, 400);
        });
      }, 200);
    }, 100);
    return;
  }

  chatLocked = true;
  chatOptions.classList.remove('visible');
  setTimeout(function() { chatOptions.innerHTML = ''; }, 300);
  chatInput.value = '';
  chatInput.disabled = true;
  chatSend.disabled = true;

  setTimeout(function() {
    addMessage('visitor', text);
    conversationHistory.push({ role: 'user', content: text });

    var typing = document.createElement('div');
    typing.className = 'chat-bubble chat-jacob typing-bubble';
    typing.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
    chatThread.appendChild(typing);
    scrollChat();

    fetch(CHAT_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: conversationHistory })
    })
    .then(function(res) {
      if (!res.ok) throw new Error('API error');
      return res.json();
    })
    .then(function(data) {
      typing.remove();
      var reply = data.reply || "Something glitched on my end. Try again or just email me at jacobcharendoff@gmail.com.";
      addMessage('jacob', reply);
      conversationHistory.push({ role: 'assistant', content: reply });
      chatLocked = false;
      chatInput.disabled = false;
      chatSend.disabled = false;
      chatInput.focus();
      var followUps = followUpSets[followUpIndex % followUpSets.length];
      followUpIndex++;
      setTimeout(function() { showSuggestions(followUps); }, 500);
    })
    .catch(function(err) {
      typing.remove();
      addMessage('jacob', "Connection hiccup. Try again, or reach me directly at jacobcharendoff@gmail.com or (647) 680-2324.");
      chatLocked = false;
      chatInput.disabled = false;
      chatSend.disabled = false;
      chatInput.focus();
    });
  }, 100);
}

function handleFreeformInput() {

function toggleDepth() {
  const s = slides[current];
  if (!s.detail) return;

  depthOpen = !depthOpen;

  if (depthOpen) {
    depthPrompt.classList.add('expanded');
    depthPromptText.textContent = 'Collapse';
    depthIndicator.classList.add('show');

    let html = '<div class="detail-grid">';
    s.detail.cells.forEach(c => {
      html += `<div class="detail-cell">
        <div class="detail-cell-label" style="color:${c.color}">${c.label}</div>
        <div class="detail-cell-text">${c.text}</div>
      </div>`;
    });
    html += '</div>';

    if (s.detail.ba && s.detail.ba.length) {
      html += '<div class="detail-ba">';
      s.detail.ba.forEach(b => {
        html += `<div class="ba-item">
          <div class="ba-before">${b.before}</div>
          <div class="ba-after" style="color:${s.color}">${b.after}</div>
          <div class="ba-label">${b.label}</div>
        </div>`;
      });
      html += '</div>';
    }

    detail.innerHTML = html;
    requestAnimationFrame(() => detail.classList.add('open'));
  } else {
    depthPrompt.classList.remove('expanded');
    depthPromptText.textContent = 'Go deeper';
    depthIndicator.classList.remove('show');
    detail.classList.remove('open');
    setTimeout(() => { detail.innerHTML = ''; }, 400);
  }
}

function goTo(index) {
  if (transitioning || index === current || index < 0 || index >= slides.length) return;
  current = index;
  document.getElementById('stage').scrollTop = 0;
  render(current);
}

function next() { goTo(current + 1); }
function prev() { goTo(current - 1); }

window.addEventListener('wheel', (e) => {
  if (chatActive || transitioning) return;

  var stageEl = document.getElementById('stage');
  var hasInternalScroll = stageEl.scrollHeight > stageEl.clientHeight + 2;
  if (hasInternalScroll) {
    var atBottom = stageEl.scrollTop + stageEl.clientHeight >= stageEl.scrollHeight - 8;
    var atTop = stageEl.scrollTop <= 8;
    if (e.deltaY > 0 && !atBottom) { scrollAccum = 0; return; }
    if (e.deltaY < 0 && !atTop) { scrollAccum = 0; return; }
  }

  scrollAccum += e.deltaY;

  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => { scrollAccum = 0; }, 200);

  const threshold = 80;
  if (Math.abs(scrollAccum) >= threshold) {
    if (depthOpen && scrollAccum < 0) {
      toggleDepth();
    } else if (scrollAccum > 0) {
      next();
    } else {
      prev();
    }
    scrollAccum = 0;
  }
}, { passive: true });

window.addEventListener('keydown', (e) => {
  if (chatActive) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    if (depthOpen) { toggleDepth(); return; }
    next();
  }
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    e.preventDefault();
    if (depthOpen) { toggleDepth(); return; }
    prev();
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (slides[current].type === 'company') toggleDepth();
  }
});

progressTrack.addEventListener('click', (e) => {
  const rect = progressTrack.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const target = Math.round(pct * (slides.length - 1));
  goTo(target);
});

let touchStartY = 0;
window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchend', (e) => {
  if (chatActive) return;
  var stageEl = document.getElementById('stage');
  var hasInternalScroll = stageEl.scrollHeight > stageEl.clientHeight + 2;
  if (hasInternalScroll) {
    var atBottom = stageEl.scrollTop + stageEl.clientHeight >= stageEl.scrollHeight - 8;
    var atTop = stageEl.scrollTop <= 8;
    var dy = touchStartY - e.changedTouches[0].clientY;
    if (dy > 0 && !atBottom) return;
    if (dy < 0 && !atTop) return;
  }
  var dy = touchStartY - e.changedTouches[0].clientY;
  if (Math.abs(dy) > 40) {
    if (dy > 0) next(); else prev();
  }
}, { passive: true });

const scrollIndicator = document.getElementById('scrollIndicator');
const chatFloat = document.getElementById('chatFloat');

function updateOverlays() {
  if (current === 0) {
    scrollIndicator.classList.remove('hidden');
  } else {
    scrollIndicator.classList.add('hidden');
  }
  const chatSlideIndex = slides.length - 1;
  if (current >= 2 && current !== chatSlideIndex) {
    chatFloat.classList.add('visible');
  } else {
    chatFloat.classList.remove('visible');
  }
}

let touchStartX = 0;
let touchDragActive = false;
window.addEventListener('touchmove', (e) => {
  if (chatActive || transitioning) return;
  const dy = touchStartY - e.touches[0].clientY;
  if (Math.abs(dy) > 10 && !touchDragActive) {
    touchDragActive = true;
    content.classList.add('touch-dragging');
  }
  if (touchDragActive) {
    const clampedDy = Math.max(-40, Math.min(40, dy * 0.3));
    content.style.transform = 'translateY(' + (-clampedDy) + 'px)';
    content.style.opacity = 1 - Math.abs(clampedDy) / 120;
  }
}, { passive: true });

const origTouchEnd = window.ontouchend;
window.addEventListener('touchend', (e) => {
  if (touchDragActive) {
    touchDragActive = false;
    content.classList.remove('touch-dragging');
    content.style.transform = '';
    content.style.opacity = '';
  }
}, { passive: true });

function applyCompactDots() {
  if (window.innerWidth <= 400) {
    document.querySelectorAll('.chapter-dot').forEach(d => {
      const idx = parseInt(d.dataset.index);
      const s = slides[idx];
      if (s.type === 'chapter') d.classList.add('compact-hide');
    });
  }
}
applyCompactDots();

render(0, false);
updateOverlays();
setTimeout(playEntrance, 100);
</script>

</body>
</html>
